<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PicoKey Commissioner (WebUSB)</title>
<style>
  :root{
    --bg:#12161c; --panel:#1b2129; --panel2:#232b35; --line:#313c49;
    --fg:#e6edf3; --dim:#93a1b1; --accent:#3b82f6; --ok:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       padding:12px;max-width:780px;margin:0 auto}
  h1{font-size:19px;margin:4px 0 2px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--fg);
     border-left:3px solid var(--accent);padding-left:8px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:10px}
  .langbar{display:flex;gap:6px;margin-bottom:10px}
  .langbar button{flex:0 0 auto;padding:5px 12px;font-size:13px}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  button:active{opacity:.7}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  button.ghost{background:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .row>button{flex:1 1 auto;min-width:120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  input[type=text],input[type=number],select{
    width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:9px 10px;font-size:15px;font-family:inherit}
  input[type=number]{font-family:var(--mono)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  #log{background:#0b0e13;border:1px solid var(--line);border-radius:8px;
       padding:10px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;
       max-height:340px;overflow:auto;color:#c9d5e1}
  .lv-ok{color:var(--ok)} .lv-warn{color:var(--warn)} .lv-err{color:var(--danger)} .lv-dim{color:var(--dim)}
  .banner{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d}
  .banner.danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
  .kv{display:flex;justify-content:space-between;gap:10px;font:13px/1.8 var(--mono);
      border-bottom:1px dashed var(--line);padding:2px 0}
  .kv span:last-child{color:#7dd3fc}
  .hidden{display:none}
  .tail{color:var(--dim);font-size:12px;text-align:center;margin:16px 0}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:13px}

  /* ---- modal ---- */
  #modalMask{position:fixed;inset:0;background:rgba(0,0,0,.62);
             display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
  /* Specificity: #modalMask (1,0,0) beats .hidden (0,1,0), so a bare .hidden
     would never hide this element and closeModal() would look "unclickable".
     This selector is (1,1,0) and wins. Do not remove it. */
  #modalMask.hidden{display:none}
  #modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
            max-width:520px;width:100%;max-height:80vh;overflow:auto;
            padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #modalTitle{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
  #modalBody{font-size:14px;line-height:1.65;color:#dbe4ee;white-space:pre-wrap}
  #modalBody b{color:#fff}
  #modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #modalIcon{font-size:19px}
  .lv-icon-ok{color:var(--ok)} .lv-icon-warn{color:var(--warn)} .lv-icon-err{color:var(--danger)}

  /* ---- 状态徽标 ---- */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;
         border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--dim)}
  .badge.on{color:var(--ok);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
  .badge.off{color:var(--dim)}
  .badge.warn{color:var(--warn);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
  .statusgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--dim);
        border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="langbar">
  <button class="ghost" onclick="setLang('zh')">简体中文</button>
  <button class="ghost" onclick="setLang('en')">English</button>
</div>

<h1 data-i18n="title">PicoKey 开光工具</h1>
<div class="sub" data-i18n="subtitle">通过 WebUSB 直接配置 Pico FIDO 设备 · 无需安装 App · 无需编译</div>

<div class="banner warn" data-i18n="warnIrreversible"></div>

<!-- ============ 连接 ============ -->
<h2 data-i18n="secConnect">1. 连接设备</h2>
<div class="card">
  <div class="row">
    <button class="primary" id="btnConnect" onclick="connect()" data-i18n="btnConnect">选择 USB 设备</button>
    <button id="btnDiag" onclick="diagnose()" disabled data-i18n="btnDiag">诊断接口</button>
    <button id="btnPowerOn" onclick="manualPowerOn()" disabled data-i18n="btnPowerOn">上电</button>
    <button id="btnDisconnect" onclick="disconnect()" disabled data-i18n="btnDisconnect">断开</button>
  </div>
  <div id="devInfo" class="hidden"></div>
  <div id="devStatus"></div>
  <div class="sub" data-i18n="hintConnect" style="margin-top:8px"></div>
  <div class="sub" data-i18n="reconnectTip"></div>
</div>

<!-- ============ 读 ============ -->
<h2 data-i18n="secRead">2. 开发板状态</h2>
<div class="card">
  <div class="row">
    <button id="btnRefresh" onclick="refreshAll()" disabled data-i18n="btnRefresh">重新读取全部</button>
  </div>
  <div class="sub" data-i18n="hintAuto"></div>
  <div id="phyOut"></div>
  <div id="flashOut"></div>
  <div id="secOut"></div>
</div>

<!-- ============ 开光 ============ -->
<h2 data-i18n="secWrite">3. 写入配置（可反复修改）</h2>
<div class="card">
  <div class="row" style="margin-bottom:10px">
    <button class="primary" id="btnPresetYk" onclick="applyYubikey()" disabled data-i18n="btnPresetYk">填入 YubiKey 预设</button>
    <button class="ghost" id="btnLoadCurrent" onclick="loadCurrent()" disabled data-i18n="btnLoadCurrent">载入当前值</button>
  </div>

  <label data-i18n="lblVid">VID（十六进制）</label>
  <input type="text" id="vid" placeholder="1050" value="1050">
  <label data-i18n="lblPid">PID（十六进制）</label>
  <input type="text" id="pid" placeholder="0407" value="0407">
  <label data-i18n="lblProduct">USB 产品名（Product Name）</label>
  <input type="text" id="product" placeholder="yubico yubikey">

  <div class="grid2">
    <div>
      <label data-i18n="lblLedGpio">LED GPIO</label>
      <input type="number" id="ledGpio" placeholder="25">
    </div>
    <div>
      <label data-i18n="lblBrightness">亮度 0-15</label>
      <input type="number" id="brightness" placeholder="3" min="0" max="15">
    </div>
    <div>
      <label data-i18n="lblUpBtn">触摸超时（秒）</label>
      <input type="number" id="upBtn" placeholder="15">
    </div>
    <div>
      <label data-i18n="lblLedDriver">LED 驱动</label>
      <select id="ledDriver">
        <option value="1">Pico (标准 GPIO)</option>
        <option value="2">Pimoroni</option>
        <option value="3">WS2812</option>
        <option value="4">CYW43</option>
        <option value="5">NeoPixel</option>
        <option value="255">无</option>
      </select>
    </div>
  </div>

  <label data-i18n="lblOpts">选项（OPTS）</label>
  <div class="chk"><input type="checkbox" id="optDimm"><span data-i18n="optDimm">LED 可调光</span></div>
  <div class="chk"><input type="checkbox" id="optSteady"><span data-i18n="optSteady">LED 常亮（不闪烁）</span></div>
  <div class="chk"><input type="checkbox" id="optWcid"><span data-i18n="optWcid">WCID</span></div>
  <div class="chk"><input type="checkbox" id="optNoPwrRst"><span data-i18n="optNoPwrRst">禁用电源复位</span></div>

  <div class="row" style="margin-top:12px">
    <button class="primary" id="btnWritePhy" onclick="writePhy()" disabled data-i18n="btnWritePhy">写入 PHY 配置</button>
  </div>
  <div class="sub" data-i18n="hintWrite"></div>
</div>

<!-- ============ 危险区 ============ -->
<h2 data-i18n="secDanger">4. 安全启动 / 安全锁（不可逆）</h2>
<div class="card">
  <div class="banner danger" data-i18n="dangerText"></div>

  <div class="grid2">
    <div>
      <label data-i18n="lblSlot">密钥槽 0-15</label>
      <input type="number" id="slot" value="0" min="0" max="15">
    </div>
    <div style="display:flex;align-items:flex-end;padding-bottom:9px">
      <div class="chk" style="margin:0">
        <input type="checkbox" id="chkLock"><span data-i18n="chkLock">同时启用 Secure Lock</span>
      </div>
    </div>
  </div>

  <div class="chk">
    <input type="checkbox" id="chkUnderstand"><span data-i18n="chkUnderstand">我已知晓此操作永久不可逆</span>
  </div>
  <label data-i18n="lblConfirm">请输入 CONFIRM 以启用按钮</label>
  <input type="text" id="confirmText" placeholder="CONFIRM" autocomplete="off">

  <div class="row" style="margin-top:10px">
    <button class="danger" id="btnSecure" onclick="setSecureBoot()" disabled data-i18n="btnSecure">设置安全启动</button>
  </div>
</div>

<!-- ============ 维护 ============ -->
<h2 data-i18n="secMisc">5. 维护</h2>
<div class="card">
  <div class="row">
    <button id="btnReboot" onclick="reboot(false)" disabled data-i18n="btnReboot">重启设备</button>
    <button id="btnBootsel" onclick="reboot(true)" disabled data-i18n="btnBootsel">重启到刷机模式</button>
  </div>
</div>

<h2 data-i18n="secLog">日志</h2>
<div class="card">
  <div id="log"></div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" onclick="clearLog()" data-i18n="btnClearLog">清空日志</button>
    <button class="ghost" onclick="copyLog()" data-i18n="btnCopyLog">复制日志</button>
  </div>
</div>

<details class="card" id="changelogCard">
  <summary data-i18n="secChangelog">更新日志</summary>
  <div class="sub" data-i18n="changelogTitle" style="margin-top:6px"></div>
  <pre data-i18n="changelogText" style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:inherit;font-size:12px;line-height:1.65"></pre>
</details>

<div class="tail">
  <span data-i18n="tail1">协议移植自 pypicokey (AGPL-3.0) · 本页为独立实现</span><br>
  <span data-i18n="tail2">需要 HTTPS + Chrome/Edge · 桌面端可能被系统 CCID 驱动抢占</span>
</div>

<div id="modalMask" class="hidden">
  <div id="modalBox">
    <h3 id="modalTitle"><span id="modalIcon"></span><span id="modalTitleText"></span></h3>
    <div id="modalBody"></div>
    <div id="modalFoot">
      <button class="primary" onclick="closeModal()" data-i18n="btnModalOk">知道了</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   PicoKey Commissioner — 单文件 WebUSB 开光工具
   协议来源：pypicokey (AGPL-3.0) 的 PicoKey.py / PhyData.py / ICCD.py
   本文件是独立实现，不含上游代码。
   ========================================================================= */

const I18N = {

    secConnect:"1. 连接设备", secRead:"2. 开发板状态", secWrite:"3. 写入配置（可反复修改）",

    btnReadPhy:"读取 PHY 配置", btnReadSecure:"读取安全状态", btnReadFlash:"读取 Flash",
    btnPresetYk:"填入 YubiKey 预设", btnLoadCurrent:"载入当前值",
    lblVid:"VID（十六进制）", lblPid:"PID（十六进制）", lblProduct:"USB 产品名（Product Name）",
    lblLedGpio:"LED GPIO", lblBrightness:"亮度 0-15", lblUpBtn:"触摸超时（秒）", lblLedDriver:"LED 驱动",
    lblOpts:"选项（OPTS）", optDimm:"LED 可调光", optSteady:"LED 常亮（不闪烁）",
    optWcid:"WCID", optNoPwrRst:"禁用电源复位",
    btnWritePhy:"写入 PHY 配置", hintWrite:"留空的字段会从设备当前值继承。写入后设备会自动重启。",
    dangerText:"🚨 危险：Secure Boot 一旦开启，设备只能运行官方签名的固件，无法再刷第三方固件。Secure Lock 写入 OTP，物理固化。两者都无法撤销。ESP32-S3 上这两个功能可能未实现 —— 请先点「读取安全状态」确认设备有响应，再决定是否继续。",
    lblSlot:"密钥槽 0-15", chkLock:"同时启用 Secure Lock",
    chkUnderstand:"我已知晓此操作永久不可逆", lblConfirm:"请输入 CONFIRM 以启用按钮", btnSecure:"设置安全启动",
    btnReboot:"重启设备", btnBootsel:"重启到刷机模式",
    btnClearLog:"清空日志", btnCopyLog:"复制日志",
    tail1:"协议移植自 pypicokey (AGPL-3.0) · 本页为独立实现",
    tail2:"需要 HTTPS + Chrome/Edge · 桌面端可能被系统 CCID 驱动抢占",
    // runtime
    noWebUSB:"此浏览器不支持 WebUSB。请用 Android 上的 Chrome 或 Edge（需 HTTPS）。",
    notSecure:"页面不在安全上下文（HTTPS），WebUSB 被禁用。",
    connected:"已连接", noDevice:"未选择设备",
    claimFail:"无法占用接口（可能被系统驱动或其它 App 占用）",
    noIntf:"没找到可用的 CCID(0x0B) 或 Vendor(0xFF) 接口",
    noBulk:"接口上没找到 bulk 端点",
    selecting:"请在弹出的选择器中挑选你的 PicoKey…",
    cancelled:"已取消选择",
    okPhy:"PHY 读取成功", okSec:"安全状态读取成功", okWrite:"PHY 写入成功，设备将重启",

    okReboot:"重启指令已发送",

    needConfirm:"请勾选确认框并输入 CONFIRM",

    disconnected:"设备已断开",

    btnPowerOn:"上电", powerOnOk:"ICC 已上电",
    errNotPowered:"ICC 未激活（需要先上电）",

    hintPowerOn:"若持续失败：拔插设备后重试，或点「上电」手动激活。",

    stFlashUsed:"Flash 已用", stFlashFiles:"文件数",
    mNoUsbTitle:"浏览器不支持 WebUSB",
    mNoUsbBody:"WebUSB 是这个页面连接设备的前提，当前浏览器没有提供它。\n\n请用 Android 手机上的 Chrome 或 Edge 打开本页。国内常见的 UC、QQ 浏览器、微信内置浏览器大多不支持。\n\n另外注意：地址必须是 https:// 开头。",

    mNoIntfTitle:"找不到可用接口",
    mNoIntfBody:"设备上没找到 CCID(0x0B) 或 Vendor(0xFF) 接口，或者接口被系统驱动/其它 App 占用了。\n\n可以试试：\n1. 换一根确认能传数据的线（纯充电线不行）\n2. 拔插设备后重试\n3. 关闭可能占用它的其它应用\n4. 点「诊断接口」看设备到底暴露了什么",

    mGoneBody:"设备从 USB 上消失了（可能是被拔掉，也可能是写入配置后自动重启了）。\n\n如果是刚写入 PHY 配置后断开，那属于正常现象 —— 重新插上再连一次即可。",
    mPhyTitle:"PHY 配置读取成功",
    mPhyBody:"已读到当前配置，下方输入框的空白项会自动继承这些值，不会把板子特有的设置冲掉。",
    mFailTitle:"读取失败",
    mPhyFailBody:"没能读到 PHY 配置。设备可能正忙、接口被占用，或者需要重新上电。\n\n先看日志里的具体报错，再试试拔插重连。",
    mSecTitle:"安全启动状态",
    mSecUnavailBody:"设备对安全状态查询没有返回有效数据。\n\n这通常意味着该固件/芯片上没有实现这个功能（ESP32-S3 上较常见）。\n\n请不要强行写入 —— OTP 熔丝一旦烧错是物理级不可逆的。",
    mSecOnBody:"注意：这台设备已经开启了安全启动或安全锁，只能运行官方签名的固件。",
    stPartial:"部分读取失败",
    warnJtag:"注意：设备名看起来是 ESP32 的 Serial/JTAG 或下载接口，不是 PicoKey 的 CCID 接口。",
    mJtagTitle:"可能选错了设备/模式",

let LANG = 'zh';
function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) || k;
  if (vars) for (const [a,b] of Object.entries(vars)) s = s.replace('{'+a+'}', b);
  return s;
}
function setLang(l){
  LANG = l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  log('lang = ' + l, 'dim');
}
function clearLang(){
  document.querySelectorAll('.langbar button').forEach(b=>b.classList.remove('primary'));
}

/* ------------------------------- logging ------------------------------- */
const logEl = document.getElementById('log');
function log(msg, level){
  const ts = new Date().toTimeString().slice(0,8);
  const cls = level ? 'lv-' + level : '';
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = '[' + ts + '] ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function hex(b){ return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(' '); }
function clearLog(){ logEl.innerHTML=''; }

/* ------------------------------- modal -------------------------------
   Anything the user MUST see goes here instead of only into the log —
   a red line at the bottom of a scrolling log is easy to miss, especially
   on a phone. Uses plain text (not innerHTML) so translated strings can
   never inject markup.
   ------------------------------------------------------------------- */
const MODAL_ICON = { ok:'✅', warn:'⚠️', err:'🚨' };
function showModal(titleKey, bodyKey, level){
  const mask = document.getElementById('modalMask');
  const icon = document.getElementById('modalIcon');
  document.getElementById('modalTitleText').textContent = t(titleKey);
  document.getElementById('modalBody').textContent = t(bodyKey);
  icon.textContent = MODAL_ICON[level] || 'ℹ️';
  icon.className = 'lv-icon-' + (level || 'ok');
  mask.classList.remove('hidden');
  log('[modal:' + level + '] ' + t(titleKey), level === 'ok' ? 'ok' : level);
}
function closeModal(){
  document.getElementById('modalMask').classList.add('hidden');
}
document.getElementById('modalMask').addEventListener('click', (ev)=>{
  if (ev.target.id === 'modalMask') closeModal();
});

/* ------------------------------- status badges -------------------------------
   Board status is fetched automatically on connect, so the user does not have
   to know which of the three read commands to press first.
   -------------------------------------------------------------------------- */
function badge(text, kind){
  return '<span class="badge ' + (kind||'off') + '">' + text + '</span>';
}
function renderStatus(s){
  const el = document.getElementById('devStatus');
  if (!s){ el.innerHTML = ''; return; }
  let h = '<div class="statusgrid">';
  h += badge(t('stChannel') + ': ' + s.channel, 'on');
  if (s.powered !== undefined) h += badge(t('stPowered') + ': ' + (s.powered ? t('stYes') : t('stNo')), s.powered ? 'on' : 'warn');
  if (s.product) h += badge(s.product, 'on');
  h += '</div>';
  el.innerHTML = h;
}

async function refreshAll(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  document.getElementById('devStatus').innerHTML =
    '<div class="statusgrid"><span class="badge"><span class="spin"></span> ' + t('stReading') + '</span></div>';
  try {
    const phy = await readPhy(true);
    await readFlash(true);
    await readSecure(true);
    if (phy){
      log(t('stDone'), 'ok');
    } else {
      log(t('stPartial'), 'warn');
      showModal('mTimeoutTitle','mTimeoutBody','warn');
    }
  } catch(e){
    log('refresh: ' + e.message, 'warn');
  }
  btn.disabled = !device;
  renderStatus(boardStatus);
}

function copyLog(){
  navigator.clipboard && navigator.clipboard.writeText(logEl.innerText);
  log('copied', 'dim');
}

/* ------------------------------- USB state ------------------------------- */
let device = null;
let iface = null;
let epIn = null;   // bulk IN  endpoint number
let epOut = null;  // bulk OUT endpoint number
let seq = 0;       // CCID bSeq
let currentPhy = null;
let boardStatus = {};   // auto-fetched board state, shown as badges

/* Buttons that do nothing until a device is connected. Keeping them enabled
   and erroring on click is worse UX: a greyed button explains itself. */
const GATED = ['btnRefresh','btnPresetYk','btnLoadCurrent','btnWritePhy',
               'btnReboot','btnBootsel'];
function setGated(enabled){
  for (const id of GATED){
    const el = document.getElementById(id);
    if (el) el.disabled = !enabled;
  }
  // btnSecure has an extra CONFIRM gate on top of "device connected".
  if (typeof updateSecureGate === 'function') updateSecureGate();
}

const AID_SELECT = [0x00,0xA4,0x04,0x04,0x08,0xA0,0x58,0x3F,0xC1,0x9B,0x7E,0x4F,0x21,0x00];
const SW_OK = 0x9000;

function hex2(v, fallback){
  if (v === null || v === undefined || String(v).trim()==='') return fallback;
  const n = parseInt(String(v).trim(), 16);
  return isNaN(n) ? fallback : n;
}
function intOr(v, fallback){
  if (v === null || v === undefined || String(v).trim()==='') return fallback;
  const n = parseInt(String(v).trim(), 10);
  return isNaN(n) ? fallback : n;
}

/* ------------------------------- connect ------------------------------- */
async function connect(){
  if (!navigator.usb){ log(t('noWebUSB'),'err'); return; }
  if (!window.isSecureContext){ log(t('notSecure'),'err'); return; }
  // Already authorised? Skip the chooser entirely. requestDevice() is the only
  // call that can come up empty, and re-picking a device the user already
  // granted is pure friction - especially since Android drops the grant on
  // every unplug, so the common case really is a fresh pick.
  let picked = null;
  try {
    const known = await navigator.usb.getDevices();
    if (known && known.length){
      picked = known[0];
      log(t('reused'), 'ok');
    }
  } catch(e){ /* optional; fall through to the picker */ }

  if (!picked){
    log(t('selecting'),'dim');
    try {
      // No filters: let the user pick anything, so unknown VID/PIDs still work.
      // An empty filter lists every device the browser is willing to claim, so
      // an empty chooser means "nothing claimable", not "wrong filter".
      picked = await navigator.usb.requestDevice({ filters: [] });
    } catch(e){
      const name = (e && e.name) || '';
      if (name === 'NotFoundError'){
        // The chooser came up empty. Reporting "cancelled" here is both wrong
        // and useless: the user needs to know why nothing was listed at all.
        log(t('mNoDevTitle'), 'err');
        showModal('mNoDevTitle','mNoDevBody','err');
        return;
      }
      log(t('cancelled') + ' (' + name + ')','warn'); return;
    }
  }
  device = picked;
  log(t('connected') + ': ' + device.manufacturerName + ' / ' + device.productName +
      '  [0x' + device.vendorId.toString(16).padStart(4,'0') + ':0x' +
      device.productId.toString(16).padStart(4,'0') + ']', 'ok');

  try { await device.open(); } catch(e){ log('open failed: '+e.message,'err'); return; }

  const ok = await pickInterface();
  if (!ok){
    showModal('mNoIntfTitle','mNoIntfBody','err');
    try { await device.close(); } catch(e){}
    resetUi();
    return;
  }

  // Enable the UI FIRST. Nothing below may block the buttons: a stalled
  // transfer used to leave every control greyed out forever, because
  // setGated(true) sat after an await that never settled.
  device.addEventListener('disconnect', ()=>{
    log(t('disconnected'),'warn');
    showModal('mGoneTitle','mGoneBody','warn');
    resetUi();
  });

  document.getElementById('btnDiag').disabled = false;
  document.getElementById('btnPowerOn').disabled = false;
  document.getElementById('btnDisconnect').disabled = false;
  setGated(true);
  showDevInfo();

  boardStatus = { channel: 'CCID/0x0B' };
  renderStatus(boardStatus);

  // An ESP32-S3 presenting as "USB JTAG/serial debug unit" is its
  // Serial/JTAG or ROM-download interface, not the PicoKey CCID applet.
  // Talking CCID to it will never get an answer.
  const nm = ((device.manufacturerName||'') + ' ' + (device.productName||'')).toLowerCase();
  if (nm.includes('jtag') || nm.includes('serial debug')){
    log(t('warnJtag'), 'warn');
    showModal('mJtagTitle','mJtagBody','warn');
  }

  let powered = false;
  try { powered = await iccPowerOn(); }
  catch(e){ log('IccPowerOn: ' + e.message, 'warn'); }
  boardStatus.powered = powered;
  renderStatus(boardStatus);

  // Auto-fetch: the user should not have to know which read command to
  // press first. Everything here is read-only and safe to run unattended.
  await refreshAll();

  if (!powered){
    showModal('mNoPowerTitle','mNoPowerBody','warn');
  }
}

async function pickInterface(){
  // Prefer CCID (0x0B), fall back to vendor-specific rescue (0xFF).
  const want = [0x0B, 0xFF];
  for (const cls of want){
    for (const cfg of device.configurations){
      for (const intf of cfg.interfaces){
        for (const alt of intf.alternates){
          if (alt.interfaceClass !== cls) continue;
          const ein = alt.endpoints.find(e=>e.direction==='in' && e.type==='bulk');
          const eout= alt.endpoints.find(e=>e.direction==='out'&& e.type==='bulk');
          if (!ein || !eout) continue;
          try {
            await device.claimInterface(intf.interfaceNumber);
            iface = intf.interfaceNumber; epIn = ein.endpointNumber; epOut = eout.endpointNumber;
            log(t('willUse', {n:intf.interfaceNumber, c:cls.toString(16)}),'ok');
            log('  IN=0x'+epIn.toString(16)+' OUT=0x'+epOut.toString(16),'dim');
            return true;
          } catch(e){
            log('claim interface #'+intf.interfaceNumber+' failed: '+e.message,'warn');
          }
        }
      }
    }
  }
  log(t('noIntf'),'err');
  log(t('hint'),'dim');
  return false;
}

function showDevInfo(){
  const el = document.getElementById('devInfo');
  el.classList.remove('hidden');
  el.innerHTML =
    '<div class="kv"><span>VID:PID</span><span>0x'+device.vendorId.toString(16).padStart(4,'0')+
    ':0x'+device.productId.toString(16).padStart(4,'0')+'</span></div>'+
    '<div class="kv"><span>interface</span><span>#'+iface+'</span></div>'+
    '<div class="kv"><span>endpoints</span><span>IN 0x'+epIn.toString(16)+' / OUT 0x'+epOut.toString(16)+'</span></div>';
}

function resetUi(){
  device=null; iface=null; epIn=null; epOut=null; currentPhy=null; boardStatus={};
  document.getElementById('btnDiag').disabled = true;
  document.getElementById('btnPowerOn').disabled = true;
  document.getElementById('btnDisconnect').disabled = true;
  setGated(false);
  document.getElementById('devInfo').classList.add('hidden');
  document.getElementById('devStatus').innerHTML = '';
  document.getElementById('confirmText').dispatchEvent(new Event('input'));
}

async function disconnect(){
  try { if (device) await device.close(); } catch(e){}
  log('closed','dim'); resetUi();
}

async function manualPowerOn(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  try { await iccPowerOn(); } catch(e){ log('IccPowerOn: '+e.message,'err'); }
}

async function diagnose(){
  if (!device){ log(t('noDevice'),'warn'); return; }
  log(t('diagTitle'),'dim');
  for (const cfg of device.configurations){
    for (const intf of cfg.interfaces){
      for (const alt of intf.alternates){
        log(t('intfLine',{n:intf.interfaceNumber,
          c:alt.interfaceClass.toString(16).padStart(2,'0'),
          s:alt.interfaceSubclass.toString(16).padStart(2,'0'),
          p:alt.interfaceProtocol.toString(16).padStart(2,'0')}),'dim');
        (alt.endpoints||[]).forEach(e=>{
          log(t('epLine',{a:e.endpointNumber.toString(16).padStart(2,'0'),
                          d:e.direction, t:e.type}),'dim');
        });
      }
    }
  }
}

/* ------------------------------- CCID transport ------------------------------- */
function ccidFrame(apdu){
  const hdr = new Uint8Array(10);
  hdr[0] = 0x6F;                      // PC_to_RDR_XfrBlock
  const len = apdu.length;
  hdr[1]=len&0xFF; hdr[2]=(len>>8)&0xFF; hdr[3]=(len>>16)&0xFF; hdr[4]=(len>>24)&0xFF;
  hdr[5] = 0x00;                      // bSlot
  hdr[6] = seq & 0xFF;                // bSeq
  hdr[7] = 0x00; hdr[8] = 0x00; hdr[9] = 0x00;  // bBWI / reserved
  const out = new Uint8Array(10 + len);
  out.set(hdr,0); out.set(apdu,10);
  return out;
}

/* Raised when bStatus reports the ICC is not powered/active yet.
   The caller reacts by issuing IccPowerOn and retrying. */
class CcidNotPowered extends Error {
  constructor(m){ super(m); this.needPowerOn = true; }
}

/* ------------------------------------------------------------------
   WebUSB has no timeout: transferIn() on a silent endpoint stays pending
   forever, which used to freeze the whole connect flow with all buttons
   greyed out and no board status. Every bulk transfer now goes through
   this wrapper so a mute device produces an error instead of a hang.
   ------------------------------------------------------------------ */
const USB_TIMEOUT_MS = 2500;
class UsbTimeout extends Error {
  constructor(what){ super(what); this.isTimeout = true; }
}
function withTimeout(promise, what){
  let timer;
  return Promise.race([
    promise,
    new Promise((_, rej)=>{ timer = setTimeout(()=>rej(new UsbTimeout(what)), USB_TIMEOUT_MS); })
  ]).finally(()=>clearTimeout(timer));
}

async function usbOut(ep, data){
  const r = await withTimeout(device.transferOut(ep, data), 'transferOut');
  if (r.status !== 'ok') throw new Error('transferOut: ' + r.status);
  return r;
}
async function usbIn(ep, len){
  const r = await withTimeout(device.transferIn(ep, len), 'transferIn');
  if (r.status !== 'ok') throw new Error('transferIn: ' + r.status);
  return r;
}

/* PC_to_RDR_IccPowerOn (0x62) — must precede any XfrBlock, otherwise the
   device answers bmICCStatus=1 ("present but inactive"). */
async function iccPowerOn(){
  if (!device) throw new Error(t('noDevice'));
  seq = (seq + 1) & 0xFF;
  const f = new Uint8Array(10);
  f[0] = 0x62;          // PC_to_RDR_IccPowerOn
  f[5] = 0x00;          // bSlot
  f[6] = seq & 0xFF;    // bSeq
  f[7] = 0x00;          // bPowerSelect: automatic
  log('>> IccPowerOn ' + hex(f), 'dim');

  const res = await usbOut(epOut, f);
  if (res.status !== 'ok') throw new Error('transferOut: ' + res.status);
  const rd = await usbIn(epIn, 271);
  if (rd.status !== 'ok') throw new Error('transferIn: ' + rd.status);

  const buf = new Uint8Array(rd.data.buffer);
  log('<< ' + hex(buf), 'dim');
  if (buf.length < 10) throw new Error('short power-on response');
  if (buf[0] !== 0x80) throw new Error('unexpected msgType 0x'+buf[0].toString(16)+
                                       ' (power-on should answer RDR_to_PC_DataBlock 0x80)');
  const bmIcc = buf[7] & 0x03;
  const atr = buf.slice(10);
  log(t('powerOnOk') + ' bmICCStatus=' + bmIcc + ' ATR=' + hex(atr), bmIcc===0 ? 'ok' : 'warn');
  return bmIcc === 0;
}

async function ccidExchange(apdu){
  if (!device){ throw new Error(t('readFirst')); }
  seq = (seq + 1) & 0xFF;
  const frame = ccidFrame(apdu);
  log('>> ' + hex(frame), 'dim');

  const res = await usbOut(epOut, frame);
  if (res.status !== 'ok') throw new Error('transferOut: ' + res.status);

  const rd = await usbIn(epIn, 271);
  if (rd.status !== 'ok') throw new Error('transferIn: ' + rd.status);
  const buf = new Uint8Array(rd.data.buffer);
  log('<< ' + hex(buf), 'dim');

  if (buf.length < 10) throw new Error('short CCID response');
  if (buf[0] !== 0x80) throw new Error('unexpected CCID msgType 0x'+buf[0].toString(16));

  const bStatus = buf[7], bError = buf[8];
  const bmIcc = bStatus & 0x03;          // 0 = active, 1 = inactive, 2 = absent
  const bmCmd = (bStatus >> 6) & 0x03;   // 0 = ok,   1 = failed,     2 = time ext

  if (bmIcc !== 0){
    throw new CcidNotPowered(t('errNotPowered') +
      ' bmICCStatus=' + bmIcc + ' (bStatus=0x' + bStatus.toString(16) + ')');
  }
  if (bmCmd === 1){
    throw new Error(t('swError') + ' bmCmdStatus=1 bError=0x' + bError.toString(16));
  }
  if (bmCmd === 2){
    throw new Error('time extension requested (unsupported)');
  }
  return buf.slice(10);
}

/* Send an APDU, following ISO 7816-4 chaining via 0x61 (GetResponse). */
async function sendApdu(apdu){
  let resp;
  try {
    resp = await ccidExchange(apdu);
  } catch(e){
    // A timeout means the device is mute - retrying after a power-on would
    // just burn another timeout, so let it surface immediately.
    if (e && e.isTimeout) throw e;
    if (e && e.needPowerOn){
      log(t('autoPowerOn'), 'warn');
      await iccPowerOn();
      resp = await ccidExchange(apdu);       // one retry after power-on
    } else throw e;
  }
  if (resp.length < 2) throw new Error('truncated APDU response');
  let sw = (resp[resp.length-2] << 8) | resp[resp.length-1];
  let data = resp.slice(0, resp.length-2);

  while ((sw & 0xFF00) === 0x6100 || sw === 0x6100){
    const ne = sw & 0x00FF;
    const get = [0x00,0xC0,0x00,0x00, ne ? ne : 0x00];
    resp = await ccidExchange(get);
    if (resp.length < 2) break;
    sw = (resp[resp.length-2] << 8) | resp[resp.length-1];
    data = concat(data, resp.slice(0, resp.length-2));
    if (sw === 0x9000) break;
  }
  return { data: data, sw: sw };
}
function concat(a,b){ const o=new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o; }

async function selectApplet(){
  const r = await sendApdu(AID_SELECT);
  log('SELECT applet -> SW=0x' + r.sw.toString(16), r.sw===SW_OK?'dim':'warn');
  return r;
}

/* ------------------------------- commands ------------------------------- */
async function readPhy(quiet){
  if (!device){ log(t('readFirst'),'warn'); return null; }
  try{
    await selectApplet();
    // 80 1E P1=01 (phy read), extended Le = 256
    const r = await sendApdu([0x80,0x1E,0x01,0x00,0x00,0x01,0x00]);
    if (r.sw !== SW_OK){ log(t('swError')+' SW=0x'+r.sw.toString(16),'err'); return null; }
    currentPhy = parsePhy(r.data);
    if (!quiet){
      log(t('okPhy'),'ok');
      showModal('mPhyTitle','mPhyBody','ok');
    }
    renderPhy(currentPhy);
    if (currentPhy.usb_product) boardStatus.product = currentPhy.usb_product;
    renderStatus(boardStatus);
    return currentPhy;
  }catch(e){
    log('readPhy: '+e.message,'err');
    if (!quiet) showModal('mFailTitle','mPhyFailBody','err');
    return null;
  }
}

async function readSecure(quiet){
  if (!device){ log(t('readFirst'),'warn'); return null; }
  try{
    await selectApplet();
    const r = await sendApdu([0x80,0x1E,0x03,0x00,0x00,0x01,0x00]);
    if (r.sw !== SW_OK){ log(t('swError')+' SW=0x'+r.sw.toString(16),'err'); return null; }
    if (!r.data || r.data.length < 2){
      log(t('secUnavailable'),'warn');
      boardStatus.secure = 'unavailable';
      document.getElementById('secOut').innerHTML =
        '<div class="kv"><span>secure</span><span>'+t('secUnavailable')+'</span></div>';
      // Important enough to interrupt: on ESP32-S3 this usually means the
      // feature is not implemented, and forcing the write is a bad idea.
      if (!quiet) showModal('mSecTitle','mSecUnavailBody','warn');
      return null;
    }
    const enabled = r.data[0] !== 0, locked = r.data[1] !== 0, bootkey = r.data[2];
    log(t('okSec')+' enabled='+enabled+' locked='+locked+' bootKey='+bootkey,'ok');
    boardStatus.secure = enabled ? 'enabled' : 'off';
    boardStatus.secureLocked = locked;
    document.getElementById('secOut').innerHTML =
      '<div class="kv"><span>secure boot</span><span>'+(enabled?'ENABLED':'off')+'</span></div>'+
      '<div class="kv"><span>secure lock</span><span>'+(locked?'LOCKED':'off')+'</span></div>'+
      '<div class="kv"><span>boot key slot</span><span>'+bootkey+'</span></div>';
    if (!quiet && (enabled || locked)) showModal('mSecTitle','mSecOnBody','warn');
    return {enabled, locked, bootkey};
  }catch(e){
    log('readSecure: '+e.message,'err');
    return null;
  }
}

async function readFlash(quiet){
  if (!device){ log(t('readFirst'),'warn'); return null; }
  try{
    await selectApplet();
    const r = await sendApdu([0x80,0x1E,0x02,0x00,0x00,0x01,0x00]);
    if (r.sw !== SW_OK){ log(t('swError')+' SW=0x'+r.sw.toString(16),'err'); return null; }
    const d = r.data;
    const u32 = o => (d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3];
    const free=u32(0), used=u32(4), total=u32(8), files=u32(12);
    log('flash: free='+free+' used='+used+' total='+total+' files='+files,'ok');
    boardStatus.flash = {free, used, total, files};
    document.getElementById('flashOut').innerHTML =
      '<div class="kv"><span>'+t('stFlashUsed')+'</span><span>'+used+' / '+total+' KB</span></div>'+
      '<div class="kv"><span>'+t('stFlashFiles')+'</span><span>'+files+'</span></div>';
    return {free, used, total, files};
  }catch(e){ log('readFlash: '+e.message,'err'); return null; }
}

function parsePhy(d){
  const o = {}; let p = 0;
  while (p + 2 <= d.length){
    const tag = d[p], len = d[p+1]; p += 2;
    if (p + len > d.length) break;
    const v = d.slice(p, p+len); p += len;
    switch(tag){
      case 0x00: if(len===4){ o.vid = (v[0]<<8)|v[1]; o.pid = (v[2]<<8)|v[3]; } break;
      case 0x04: o.led_gpio = v[0]; break;
      case 0x05: o.led_brightness = v[0]; break;
      case 0x06: o.opts = (v[0]<<8)|v[1]; break;
      case 0x08: o.up_btn = v[0]; break;
      case 0x09: { let s=v; const z=s.indexOf(0); if(z>=0) s=s.slice(0,z);
                   o.usb_product = String.fromCharCode.apply(null, s); break; }
      case 0x0A: o.enabled_curves = (v[0]<<24)|(v[1]<<16)|(v[2]<<8)|v[3]; break;
      case 0x0B: o.enabled_usb_itf = v[0]; break;
      case 0x0C: o.led_driver = v[0]; break;
    }
  }
  return o;
}
function hex4(n){ return '0x'+(n>>>0).toString(16).padStart(4,'0'); }
function hex2s(n){ return (n&0xFF).toString(16).padStart(2,'0'); }

function renderPhy(o){
  const el = document.getElementById('phyOut');
  const rows = [];
  if (o.vid !== undefined) rows.push(['VID:PID', hex4(o.vid).slice(0,6)+':'+hex4(o.pid).slice(2)]);
  if (o.usb_product !== undefined) rows.push(['product', o.usb_product]);
  if (o.led_gpio !== undefined) rows.push(['led gpio', o.led_gpio]);
  if (o.led_brightness !== undefined) rows.push(['brightness', o.led_brightness]);
  if (o.led_driver !== undefined) rows.push(['led driver', o.led_driver]);
  if (o.up_btn !== undefined) rows.push(['touch timeout', o.up_btn]);
  if (o.opts !== undefined) rows.push(['opts', '0x'+o.opts.toString(16)]);
  if (o.enabled_curves !== undefined) rows.push(['curves', '0x'+o.enabled_curves.toString(16)]);
  if (o.enabled_usb_itf !== undefined) rows.push(['usb itf', '0x'+o.enabled_usb_itf.toString(16)]);
  el.innerHTML = rows.map(r=>'<div class="kv"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
}

function loadCurrent(){
  if (!currentPhy){ log('read PHY first','warn'); return; }
  const o = currentPhy;
  if (o.vid !== undefined) document.getElementById('vid').value = hex4(o.vid).slice(2);
  if (o.pid !== undefined) document.getElementById('pid').value = hex4(o.pid).slice(2);
  if (o.usb_product !== undefined) document.getElementById('product').value = o.usb_product;
  if (o.led_gpio !== undefined) document.getElementById('ledGpio').value = o.led_gpio;
  if (o.led_brightness !== undefined) document.getElementById('brightness').value = o.led_brightness;
  if (o.up_btn !== undefined) document.getElementById('upBtn').value = o.up_btn;
  if (o.led_driver !== undefined) document.getElementById('ledDriver').value = String(o.led_driver);
  if (o.opts !== undefined){
    document.getElementById('optDimm').checked    = !!(o.opts & 0x02);
    document.getElementById('optSteady').checked  = !!(o.opts & 0x08);
    document.getElementById('optWcid').checked    = !!(o.opts & 0x01);
    document.getElementById('optNoPwrRst').checked= !!(o.opts & 0x04);
  }
  log('loaded current values','ok');
}
function applyYubikey(){
  document.getElementById('vid').value = '1050';
  document.getElementById('pid').value = '0407';
  document.getElementById('product').value = 'yubico yubikey';
  log('preset: YubiKey 5 (1050:0407), product="yubico yubikey"','ok');
  log('note: the product string must be exactly "yubico yubikey" for Yubico Authenticator','dim');
}

function buildPhyTlv(){
  const o = currentPhy || {};
  const b = [];
  const vid = hex2(document.getElementById('vid').value, o.vid);
  const pid = hex2(document.getElementById('pid').value, o.pid);
  if (vid !== undefined && pid !== undefined){
    b.push(0x00, 4, (vid>>8)&0xFF, vid&0xFF, (pid>>8)&0xFF, pid&0xFF);
  }
  const lg = intOr(document.getElementById('ledGpio').value, o.led_gpio);
  if (lg !== undefined) b.push(0x04, 1, lg & 0xFF);
  const br = intOr(document.getElementById('brightness').value, o.led_brightness);
  if (br !== undefined) b.push(0x05, 1, br & 0xFF);

  // OPTS is always present (2 bytes, big-endian)
  let opts = 0;
  if (document.getElementById('optWcid').checked)    opts |= 0x01;
  if (document.getElementById('optDimm').checked)    opts |= 0x02;
  if (document.getElementById('optNoPwrRst').checked)opts |= 0x04;
  if (document.getElementById('optSteady').checked)  opts |= 0x08;
  b.push(0x06, 2, (opts>>8)&0xFF, opts&0xFF);

  const ub = intOr(document.getElementById('upBtn').value, o.up_btn);
  if (ub !== undefined) b.push(0x08, 1, ub & 0xFF);

  const prod = document.getElementById('product').value;
  if (prod && prod.trim()){
    const s = Array.from(prod.trim()).map(c=>c.charCodeAt(0)&0xFF);
    if (s.length <= 31){ b.push(0x09, s.length+1, ...s, 0x00); }
    else { log('product name too long (max 31), skipped','warn'); }
  }
  if (o.enabled_curves !== undefined){
    const c = o.enabled_curves;
    b.push(0x0A, 4, (c>>>24)&0xFF, (c>>>16)&0xFF, (c>>>8)&0xFF, c&0xFF);
  }
  if (o.enabled_usb_itf !== undefined) b.push(0x0B, 1, o.enabled_usb_itf & 0xFF);
  const ld = intOr(document.getElementById('ledDriver').value, o.led_driver);
  if (ld !== undefined) b.push(0x0C, 1, ld & 0xFF);
  return b;
}

async function writePhy(){
  if (!device){ log(t('readFirst'),'warn'); return; }
  try{
    const tlv = buildPhyTlv();
    log('TLV: ' + hex(tlv),'dim');
    await selectApplet();
    // 80 1C P1=01 (phy write), extended Lc
    const hi = (tlv.length>>8)&0xFF, lo = tlv.length&0xFF;
    const apdu = [0x80,0x1C,0x01,0x00,0x00,hi,lo].concat(tlv).concat([0x00,0x00]);
    const r = await sendApdu(apdu);
    if (r.sw !== SW_OK){ log(t('swError')+' SW=0x'+r.sw.toString(16),'err'); return; }
    log(t('okWrite'),'ok');
    log('unplug and replug the device, then verify with Yubico Authenticator','dim');
  }catch(e){ log('writePhy: '+e.message,'err'); }
}

async function setSecureBoot(){
  if (!device){ log(t('readFirst'),'warn'); return; }
  if (!document.getElementById('chkUnderstand').checked ||
      document.getElementById('confirmText').value.trim().toUpperCase() !== 'CONFIRM'){
    log(t('needConfirm'),'warn'); return;
  }
  if (!confirm(LANG==='zh' ? '此操作永久不可逆，确定继续？\n开启后设备只能运行官方签名固件。'
                           : 'This is PERMANENT. Continue?\nAfter this the device only runs officially signed firmware.')){
    log('aborted by user','dim'); return;
  }
  try{
    const slot = intOr(document.getElementById('slot').value, 0);
    const lock = document.getElementById('chkLock').checked ? 1 : 0;
    if (slot < 0 || slot > 15){ log('slot must be 0-15','err'); return; }
    await selectApplet();
    const apdu = [0x80,0x1C,0x02,0x00,0x00,0x00,0x02, slot&0xFF, lock].concat([0x00,0x00]);
    const r = await sendApdu(apdu);
    if (r.sw !== SW_OK){ log(t('swError')+' SW=0x'+r.sw.toString(16),'err'); return; }
    log(t('okSecure',{slot:slot}),'ok');
  }catch(e){ log('secureBoot: '+e.message,'err'); }
}

async function reboot(bootsel){
  if (!device){ log(t('readFirst'),'warn'); return; }
  try{
    await selectApplet();
    const apdu = [0x80,0x1F, bootsel?0x01:0x00, 0x00, 0x00, 0x00, 0x00];
    const r = await sendApdu(apdu);
    log(t('okReboot')+' SW=0x'+r.sw.toString(16),'ok');
  }catch(e){ log('reboot: '+e.message + ' (device may already be rebooting)','warn'); }
}

/* ------------------------------- init ------------------------------- */
/* The secure-boot button has two gates: a device must be connected AND the
   CONFIRM handshake must be complete. Both are re-evaluated here. */
function updateSecureGate(){
  const hasDev = !!device;
  const confirmed = document.getElementById('chkUnderstand').checked &&
                    document.getElementById('confirmText').value.trim().toUpperCase()==='CONFIRM';
  document.getElementById('btnSecure').disabled = !(hasDev && confirmed);
}
document.getElementById('confirmText').addEventListener('input', updateSecureGate);
document.getElementById('chkUnderstand').addEventListener('change', updateSecureGate);

setLang('zh');
setGated(false);
// Belt and braces: the modal must start hidden even if the stylesheet fails
// to load or someone edits the markup. Without this a stuck overlay would
// swallow every tap on the page.
closeModal();

/* Fatal, page-wide problems pop up instead of hiding in the log. */
if (!navigator.usb){
  log(t('noWebUSB'),'err');
  showModal('mNoUsbTitle','mNoUsbBody','err');
} else if (!window.isSecureContext){
  log(t('notSecure'),'err');
  showModal('mNoHttpsTitle','mNoHttpsBody','err');
} else {
  log('WebUSB ready. ' + t('hintConnect'),'dim');
}
