name: Build Android APK

# Manual only, on purpose. With `on: push` enabled, every commit of this very
# file fires another run - that is how the queue ended up with a dozen
# half-finished runs that can no longer be cancelled from the UI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0. Leave empty to use v + version from buildozer.spec'
        required: false
        default: ''
      publish:
        description: 'Publish the APK to Releases'
        type: boolean
        default: true
      draft:
        description: 'Create the release as a draft (review before publishing)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      overwrite:
        description: 'Overwrite an existing release with this tag (default: fail instead, so old versions are kept)'
        type: boolean
        default: false

# Needed so GITHUB_TOKEN may create a release and upload assets. Without this
# the release step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 entered deprecation on 2026-09-17: jobs on that label wait
    # in the queue much longer at peak hours (documented by GitHub as queue
    # delays, not failures). ubuntu-24.04 is the recommended replacement.
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    # You have triggered this workflow many times; older runs can sit in the
    # queue in front of the new one and make it look "stuck". This keeps only
    # the newest run per branch and cancels whatever is still queued/running.
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip python3-pip python3-setuptools \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libssl-dev libffi-dev cmake libltdl-dev

      # p4a's bootstrap ships Gradle 8.14.3, which requires JDK 17. The
      # runner's default javac is 11, which buildozer would pick up and then
      # fail on during the Gradle stage.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm toolchain
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Show exactly how the repo was uploaded, then locate buildozer.spec
      # wherever it ended up (root, or inside a wrapper folder).
      - name: Locate project directory
        id: locate
        run: |
          echo "=== repo root ==="
          ls -la
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "::error::buildozer.spec not found anywhere in the repo"
            find . -not -path "./.git/*" | head -n 60
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "project dir = $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v2

      - name: Install buildozer / Cython
        run: |
          python3 -m pip install --user --upgrade pip
          # Cython 0.29.37 is the only choice that satisfies BOTH constraints:
          #   buildozer 1.6.0 metadata: cython<3.0
          #   p4a kivy recipe:          cython>=0.29.1,<=3.0.12
          # Pinning Cython==3.0.12 (as an earlier revision did) violates
          # buildozer's cython<3.0, and pip silently fell back to buildozer
          # 1.5.0 - which is why the old log showed "1.5.0" instead of 1.6.0.
          python3 -m pip install --user "Cython==0.29.37" "buildozer==1.6.0"
          buildozer --version
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Diagnostic only. IMPORTANT: never create ~/.buildozer/android/platform/
      # android-sdk (or anything inside it) here - buildozer decides whether to
      # download the SDK by checking if that directory exists, so pre-creating
      # it makes buildozer skip the download and then die with
      # "sdkmanager path does not exist, sdkmanager is not installed".
      - name: Report SDK state before build
        run: |
          P="$HOME/.buildozer/android/platform"
          echo "=== $P ==="
          ls -la "$P" 2>/dev/null || echo "(no platform dir yet - SDK will be downloaded)"
          echo "=== sdkmanager ==="
          ls -la "$P/android-sdk/tools/bin/" 2>/dev/null || echo "(sdkmanager not installed yet)"

      # Informational only: the APK does not depend on this passing.
      - name: Sanity check (protocol self-test, no hardware needed)
        continue-on-error: true
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          python3 -m picokeyapp.selftest || echo "self-test could not run (non-fatal)"

      # `yes |` is a catch-all for any leftover interactive prompt in the
      # toolchain (sdkmanager license, etc). buildozer.spec already sets
      # android.accept_sdk_license = True, which handles the pexpect path;
      # this covers the rest. The pipeline's exit code is buildozer's.
      - name: Build debug APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          yes | buildozer -v android debug

      - name: Diagnostics on failure
        if: failure()
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          echo "=== buildozer logs ==="
          find .buildozer "$HOME/.buildozer" -name "*.log" 2>/dev/null | head -20
          for f in $(find .buildozer -name "*.log" 2>/dev/null | tail -3); do
            echo "===== $f ====="; tail -n 150 "$f"
          done
          echo "=== SDK tree ==="
          ls -la "$HOME/.buildozer/android/platform/" 2>/dev/null
          ls -la "$HOME/.buildozer/android/platform/android-sdk/" 2>/dev/null
          ls -la "$HOME/.buildozer/android/platform/android-sdk/tools/bin/" 2>/dev/null

      # Renamed to a self-describing filename: the raw buildozer output is
      # something like picokeymanager-0.1.0-arm64_v8a-debug.apk, which says
      # nothing about what it is once it sits in a release asset list.
      - name: Prepare release assets
        id: assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          VER=$(python3 -c "
          import configparser
          c = configparser.ConfigParser()
          c.read('buildozer.spec')
          print(c['app']['version'].strip())
          " 2>/dev/null || echo "0.1.0")
          if [ -z "$VER" ]; then VER="0.1.0"; fi
          TAG="${INPUT_TAG:-v$VER}"
          case "$TAG" in v*) ;; *) TAG="v$TAG";; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          rm -rf release && mkdir -p release
          found=0
          for f in bin/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "release/picokey-manager-${TAG}-arm64-debug.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no APK produced in bin/"
            ls -la bin/ || true
            exit 1
          fi

          # The WebUSB commissioner is shipped next to the APK on purpose: it
          # needs zero compiling and works straight from GitHub Pages, which
          # is the only realistic path for someone without a PC.
          #
          # Missing HTML is NOT an error - it just means the file has not been
          # committed yet, and the release should still carry the APK.
          has_html=false
          for cand in picokey-commissioner.html \
                      docs/picokey-commissioner.html \
                      tools/picokey-commissioner.html; do
            if [ -f "$cand" ]; then
              cp "$cand" release/picokey-commissioner.html
              has_html=true
              echo "found commissioner HTML at: $cand"
              break
            fi
          done
          if [ "$has_html" = "false" ]; then
            echo "::warning::picokey-commissioner.html not found in the repo - releasing APK only"
          fi
          echo "has_html=$has_html" >> "$GITHUB_OUTPUT"

          ls -la release/

      # Kept as well: artifacts survive even if the release step is skipped or
      # fails, and they cost nothing extra.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picokey-manager-debug
          path: ${{ steps.locate.outputs.dir }}/bin/*.apk
          if-no-files-found: error

      # Runs unconditionally. The point is to make the single most confusing
      # failure - "nothing showed up in Releases" - self-explaining: if the
      # publish flag is off or the step is skipped, the log says so instead of
      # leaving you to guess from a stale release timestamp.
      - name: Report publish decision
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
          HAS_HTML: ${{ steps.assets.outputs.has_html }}
        run: |
          echo "=== publish decision ==="
          echo "  tag          : ${TAG:-(none)}"
          echo "  version      : ${VER:-(none)}"
          echo "  publish flag : ${PUBLISH:-(none)}"
          echo "  html asset   : ${HAS_HTML:-(none)}"
          if [ "${PUBLISH}" != "true" ]; then
            echo "::warning::publish=false, so NO release will be created or updated."
            echo "        The APK is still available from the 'picokey-manager-debug' artifact."
          fi
          echo "=== current releases on this repo ==="
          gh release list --limit 20 || echo "(could not list releases - check GITHUB_TOKEN permissions)"

      # ------------------------------------------------------------- release
      - name: Build release notes
        if: ${{ inputs.publish }}
        env:
          # TAG/VER come from the "Prepare release assets" step - they are not
          # shell variables until they are exported here.
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          # Bilingual on purpose: the app itself ships a zh/en switch and both
          # READMEs exist, so the release page should not be English-only.
          #
          # The heredoc is quoted ('EOF') so ${TAG} and friends stay literal for
          # the shell. Substitution is then done by Python's string.Template,
          # which only touches the three placeholders we hand it - so a stray
          # $ or ` in the prose cannot be expanded by accident. (envsubst would
          # be the obvious tool but it lives in gettext-base, which is not
          # guaranteed on every runner image.)
          cat > release/notes.tmpl <<'EOF'
          # PicoKey Manager ${TAG}

          <div align="right">

          [English](#english) | [简体中文](#简体中文)

          </div>

          ---

          ## 简体中文

          PicoKey Manager 的安卓构建版本（[pypicokey](https://github.com/IsayIsee/pypicokey) 的移植版）。

          - Commit：`${GITHUB_SHA}`
          - 版本：`${VER}`（来自 `buildozer.spec`）
          - 架构：`arm64-v8a`（debug 构建）
          - 要求：Android 8.0 以上、支持 USB host、一根 OTG 转接线

          ### 安装

          1. 下载下面的 APK。
          2. 允许浏览器 / 文件管理器"安装未知应用"的权限。
          3. 打开 App，点 **扫描 USB 设备**，并在弹窗里点 **允许**。

          ### 本 release 里的两个文件

          - `picokey-manager-${TAG}-arm64-debug.apk` —— 安卓 App，装到手机上用（需要 OTG 转接线）。
          - `picokey-commissioner.html` —— **免安装、免编译**的网页版开光工具。把它放到仓库根目录并开启
            GitHub Pages，然后用手机 Chrome 打开
            `https://<用户名>.github.io/<仓库名>/picokey-commissioner.html` 即可，
            不需要装任何 App，也不必等 Actions 编译。

          两者功能重叠，网页版更快；App 的优势是**完全离线**，不依赖任何服务器。

          ### 注意事项

          - **debug 构建**，使用 debug 签名，安装时手机可能会提示风险。
          - 由 AI 编写，且**从未在真实 PicoKey 上验证过**；出问题先怀疑这个 App。
          - `WINK` 需要 FIDO HID 通道；写入 PHY 会让设备重启。
          - **写 PHY 前先读一次**，确认数值无误再写。
          - 界面支持简体中文 / English，App 右上角可切换。

          ---

          ## English

          Android build of the PicoKey Manager (a port of [pypicokey](https://github.com/IsayIsee/pypicokey)).

          - Commit: `${GITHUB_SHA}`
          - Version: `${VER}` (from `buildozer.spec`)
          - Architecture: `arm64-v8a` (debug build)
          - Requires: Android 8.0+ with USB host support, plus an OTG adapter

          ### Install

          1. Download the APK below.
          2. Allow "install from unknown sources" for your browser/files app.
          3. Open the app, tap **Scan USB devices**, and **allow** the USB prompt.

          ### The two files in this release

          - `picokey-manager-${TAG}-arm64-debug.apk` - the Android app (needs an OTG adapter).
          - `picokey-commissioner.html` - a **zero-install, zero-compile** WebUSB commissioner.
            Commit it at the repo root, turn on GitHub Pages, then open
            `https://<user>.github.io/<repo>/picokey-commissioner.html` in Chrome on your phone.
            No app to install, no Actions run to wait for.

          They overlap; the HTML is the faster route, the app's edge is that it works fully offline.

          ### Caveats

          - **Debug build**, signed with the debug key - Android may warn on install.
          - Written by AI and **never run against a real PicoKey**; treat the app
            as the suspect first if something misbehaves.
          - `WINK` needs the FIDO HID channel; writing PHY config reboots the device.
          - **Read the PHY config before writing it.**
          - The UI speaks 简体中文 and English; switch from the spinner at the top.
          EOF
          python3 - <<'PYEOF'
          import os
          from string import Template
          raw = open('release/notes.tmpl', encoding='utf-8').read()
          out = Template(raw).safe_substitute(
              TAG=os.environ['TAG'],
              VER=os.environ['VER'],
              GITHUB_SHA=os.environ.get('GITHUB_SHA', 'unknown'),
          )
          open('release/notes.md', 'w', encoding='utf-8').write(out)
          PYEOF
          rm -f release/notes.tmpl
          cat release/notes.md
          # Guard: a literal ${...} left in the file means substitution missed.
          if grep -n '\${' release/notes.md; then
            echo "::error::unsubstituted placeholder left in release notes"
            exit 1
          fi

      - name: Create or update GitHub Release
        if: ${{ inputs.publish }}
        env:
          # GITHUB_TOKEN is enough here because `permissions: contents: write`
          # is declared at the top of this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.assets.outputs.tag }}
          VER: ${{ steps.assets.outputs.version }}
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then FLAGS+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi

          ASSETS=(release/*.apk)
          if [ -f release/picokey-commissioner.html ]; then
            ASSETS+=(release/picokey-commissioner.html)
          fi
          echo "uploading: ${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.overwrite }}" != "true" ]; then
              # Refusing to clobber is deliberate: while the version stayed at
              # 0.1.0 every run silently replaced the previous APK, so there
              # was no way to go back to an earlier build. Raise
              # buildozer.spec's `version` to publish a new one.
              echo "::error::release $TAG already exists and 'overwrite' was not enabled."
              echo "::error::Raise 'version' in buildozer.spec to publish a new version,"
              echo "::error::or re-run with 'overwrite' ticked to replace $TAG in place."
              echo ""
              echo "Releases currently published:"
              gh release list --limit 20 || true
              exit 1
            fi
            echo "release $TAG exists - replacing the built assets (overwrite enabled)"
            # --clobber only overwrites same-named files; anything you added by
            # hand stays untouched.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            # keep notes in sync with this build
            gh release edit "$TAG" --notes-file release/notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          else
            echo "creating release $TAG"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "PicoKey Manager $VER" \
              --notes-file release/notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          fi

          echo "=== release URL ==="
          gh release view "$TAG" --json url --jq '.url'
          echo "=== assets now in $TAG ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
